<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 12px; }
        fieldset { background-color: #e6e6fa; border: 1px solid #999; width: 420px; padding: 10px; }
        legend { font-weight: bold; }
        .field { clear: both; margin-bottom: 5px; overflow: hidden; }
        .field label:first-child { float: left; width: 120px; text-align: right; margin-right: 10px; }
        h2 { margin: 0 0 10px 0; }
    </style>
</head>
<body>
    <h2>Register</h2>
    <fieldset><legend>Person Details</legend>
        <form name="myForm" action="processData.php" method="POST">
            <div class="field">
                <label for="surname">Surname</label>
                <input type="text" name="surname" id="surname" size="35" />
            </div>
            <div class="field">
                <label for="email">Email address</label>
                <input type="text" name="email" id="email" size="35" />
            </div>
            <div class="field">
                <label for="passwd">Password</label>
                <input type="password" name="passwd" id="passwd" size="35" />
            </div>
            <div class="field">
                <label for="address">Street Address</label>
                <textarea name="address" id="address" rows="3" cols="22"></textarea>
            </div>
            <div class="field">
                <label for="state">State</label>
                <select name="state" id="state">
                    <option value="1">Choose your state</option>
                    <option value="2">Australian Capital Territory</option>
                    <option value="3">Queensland</option>
                    <option value="4">Victoria</option>
                    <option value="5">New South Wales</option>
                    <option value="6">Tasmania</option>
                    <option value="7">South Australia</option>
                    <option value="8">Western Australia</option>
                    <option value="9">Northern Territory</option>
                </select>
            </div>
            <div class="field">
                <input type="hidden" name="country" value="Australia" />
            </div>
            <div class="field">
                <label>Gender</label>
                <input type="radio" name="sex" value="Male" id="male" /> <label for="male" style="float:none; width:auto; text-align:left;">Male</label>
                <input type="radio" name="sex" value="Female" id="female" /> <label for="female" style="float:none; width:auto; text-align:left;">Female</label>
            </div>
            <div class="field">
                <label for="vegetarian">Vegetarian?</label>
                <input type="checkbox" name="vegetarian" id="vegetarian" />
            </div>
            <div class="field">
                <label>&nbsp;</label>
                <input type="submit" value="Submit" name="submit" /> <input type="reset" value="Reset" name="reset" />
            </div>
        </form>
    </fieldset>
</body>
</html>
